<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>B.A.T.S. Redirect</title>
    <script type="text/javascript">
        // Redirect SPA paths back to index.html
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Redirect to homepage
        window.location.replace(window.location.origin + '/index.html' + (path ? '?p=' + encodeURIComponent(path) : '') + (search ? '&' + encodeURIComponent(search) : '') + hash);
    </script>
</head>
<body>
</body>
</html>
